<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="sidebar.css" />
  <title>LI Job Scraper</title>
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 114.126 0 2.063 2.063 0 01-2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
          </svg>
        </div>
        <span class="brand-name">LI Job Scraper</span>
      </div>
      <button
        id="btn-refresh"
        class="icon-btn"
        type="button"
        title="Re-scan the current LinkedIn tab"
        aria-label="Re-scan the current LinkedIn tab"
      >
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-2.64-6.36" />
          <polyline points="21 3 21 9 15 9" />
        </svg>
      </button>
    </header>

    <div id="empty-state" class="empty-state">
      <div class="empty-state-icon" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="7" width="20" height="14" rx="2" />
          <path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
        </svg>
      </div>
      <p id="empty-state-text">Open a LinkedIn job posting to extract its description.</p>
    </div>

    <div id="job-panel" class="job-panel hidden">
      <div class="job-meta-card">
        <div class="company-avatar" id="company-avatar">?</div>
        <div class="job-meta-text">
          <h3 id="job-title" class="job-title">—</h3>
          <p class="job-company-row">
            <span id="job-company" class="job-company">—</span>
            <span id="job-posted-at" class="job-posted-at hidden"></span>
          </p>
        </div>
      </div>

      <div id="job-signals" class="job-signals hidden">
        <div id="job-tags" class="job-tags hidden"></div>
        <span id="job-applicants" class="job-applicants hidden"></span>
      </div>

      <a
        id="job-link"
        class="job-link hidden"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
      ></a>

      <div id="job-recorded-notice" class="job-recorded-notice hidden" role="status"></div>

      <div class="field-group">
        <label class="field-label" for="jd-text">Job Description</label>
        <textarea
          id="jd-text"
          class="field-textarea field-textarea-readonly jd-text"
          rows="14"
          readonly
          placeholder="Job description will appear here when extracted from LinkedIn..."
        ></textarea>
      </div>

      <div class="actions">
        <button id="btn-send" type="button" class="btn btn-primary" disabled>
          Scrape
        </button>
      </div>
    </div>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  </div>
  <script type="module" src="sidebar.js"></script>
</body>
</html>
