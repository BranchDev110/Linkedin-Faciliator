services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      STORAGE_ROOT: /app/storage
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    expose:
      - "3001"
    volumes:
      - app_storage:/app/storage
    networks:
      - lif

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - lif
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${APP_PORT:-3001}:443"
    volumes:
      - ${NGINX_CONF:-./deploy/nginx/li-facilitator-https.conf}:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_PATH:-./deploy/certs}:/etc/nginx/certs:ro
    networks:
      - lif

volumes:
  app_storage:
  mongo_data:

networks:
  lif:
    driver: bridge
