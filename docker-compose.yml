# Base compose file — application + MongoDB only.
#
# Nginx runs on the HOST (not in a container). The app is bound to 127.0.0.1
# only, so only the host's nginx can reach it — the public internet cannot
# hit the app port directly. The active override file (production / staging)
# chooses the host port to publish on (default: 3001).
#
# See docs/DEPLOYMENT.md for the full nginx + TLS setup.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    # Secrets/URLs come from env_file (not interpolated environment), so an empty
    # host shell var cannot wipe values from deploy/env/<env>.env.
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3001
      # Always use the compose network hostname — never host .env's 127.0.0.1.
      MONGODB_URI: mongodb://mongo:27017/li-facilitator
      STORAGE_ROOT: /app/storage
    # Bound to localhost only — host nginx reaches it on HOST_PORT, the
    # outside world cannot.
    ports:
      - "127.0.0.1:${HOST_PORT:-3001}:3001"
    volumes:
      - app_storage:/app/storage
    networks:
      - lif

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - lif
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  app_storage:
  mongo_data:

networks:
  lif:
    driver: bridge
