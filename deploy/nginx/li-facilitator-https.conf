# HTTPS front-end for li-facilitator (self-signed cert on a bare IP).
# Mounted into the nginx container at /etc/nginx/conf.d/default.conf
#
# Expects on the host (TLS_PATH):
#   cert.pem   - TLS certificate (CN + SAN = <VPS_IP>)
#   key.pem    - private key
#
# Browser will warn "Not Secure" on first visit because cert is self-signed;
# users must click Advanced -> Proceed / add exception.

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    client_max_body_size 25m;

    # Tell the app it's behind HTTPS so cookies/redirects use https://
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  443;

    location / {
        proxy_pass http://app:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
