# HTTPS front-end for li-facilitator.
# Mounted into the nginx container at /etc/nginx/conf.d/default.conf
#
# Expects on the host (TLS_PATH):
#   cert.pem   - TLS certificate (CN + SAN = lif.remotepairnet.net)
#   key.pem    - private key
#
# Generate once on the VPS (see README):
#   sudo openssl req -x509 -nodes -newkey rsa:2048 -days 365 \
#     -keyout key.pem -out cert.pem \
#     -subj "/CN=lif.remotepairnet.net" \
#     -addext "subjectAltName=DNS:lif.remotepairnet.net"
#
# Replace the self-signed cert with a Let's Encrypt cert once DNS is in place:
#   sudo certbot certonly --standalone -d lif.remotepairnet.net
#   # then point TLS_PATH to /etc/letsencrypt/live/lif.remotepairnet.net
#
# Browser will warn "Not Secure" on first visit while the cert is self-signed;
# users must click Advanced -> Proceed / add exception.

server {
    listen 443 ssl;
    http2 on;
    server_name lif.remotepairnet.net;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    client_max_body_size 25m;

    # Tell the app it's behind HTTPS so cookies/redirects use https://
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  443;

    location / {
        proxy_pass http://app:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
