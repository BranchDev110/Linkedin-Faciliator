# HTTPS front-end for li-facilitator.
# Mounted into the nginx container at /etc/nginx/conf.d/default.conf
#
# Cert files are bind-mounted from the host into /etc/nginx/tls/:
#   /etc/nginx/tls/fullchain.pem   (cert + chain)
#   /etc/nginx/tls/privkey.pem     (private key)
#
# In production these come from Let's Encrypt:
#   /etc/letsencrypt/live/lif.remotepairnet.net/fullchain.pem
#   /etc/letsencrypt/live/lif.remotepairnet.net/privkey.pem
#
# For self-signed dev/testing on a different host, override TLS_FULLCHAIN and
# TLS_PRIVKEY in deploy/env/production.env to point at your own cert files.

server {
    listen 443 ssl;
    http2 on;
    server_name lif.remotepairnet.net;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    client_max_body_size 25m;

    # Tell the app it's behind HTTPS so cookies/redirects use https://
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  443;

    location / {
        proxy_pass http://app:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
