# CI — validate builds on PRs and pushes to main (staging).
# Does NOT deploy. Production deploy is handled by deploy-production.yml.

name: CI

on:
  pull_request:
    branches:
      - main
      - production
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm run build:api

      - name: Build web
        run: npm run build:web
        env:
          VITE_API_URL: /api

      - name: Build extension
        run: npm run build:extension
        env:
          WEB_URL: http://localhost:3001
          API_URL: http://localhost:3001

  docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: li-facilitator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test stack
        run: |
          mkdir -p deploy/certs
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout deploy/certs/key.pem -out deploy/certs/cert.pem \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"

          printf '%s\n' \
            'JWT_SECRET=ci-secret' \
            'OPENAI_API_KEY=sk-ci' \
            'OPENAI_MODEL=gpt-5.4-mini' \
            'WEB_URL=http://localhost:3001' \
            'API_URL=http://localhost:3001' \
            > .env

          docker compose up -d --build

          # Hit the app container directly (HTTP). Host :3001 is nginx HTTPS.
          for i in $(seq 1 45); do
            if docker compose exec -T app curl -fsS http://127.0.0.1:3001/api/health; then
              echo "Health check passed"
              docker compose down -v
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          docker compose down -v
          exit 1
